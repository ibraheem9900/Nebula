kind = "web"
previewPath = "/"
title = "Nebula"
description = "A polished AI productivity assistant landing page with a scroll-controlled product video and interactive dashboard experience."
version = "1.0.0"
id = "artifacts/nebula"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18611

[services.development]
run = "pnpm --filter @workspace/nebula run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nebula", "run", "build" ]
serve = "static"
publicDir = "artifacts/nebula/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18611"
BASE_PATH = "/"
